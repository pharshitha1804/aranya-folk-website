# Decap CMS configuration — https://decapcms.org/docs/configuration-options/
# Every change saved in /admin is committed to GitHub, and Netlify rebuilds the site.

backend:
  name: github
  repo: pharshitha1804/aranya-folk-website
  branch: main

# Lets you run the CMS against your local files: `npm run cms` + `npm start`, then open http://localhost:8080/admin/
local_backend: true

# Uploaded photos are stored here and referenced as /assets/images/<file>
media_folder: src/assets/images
public_folder: /assets/images

logo_url: /assets/images/logo.png

collections:

  # ------------------------------------------------------------------
  # Plant catalog — one entry per product
  # ------------------------------------------------------------------
  - name: products
    label: Plant catalog
    label_singular: Product
    description: Plants, planters and care products shown on the Products page. Tick "Featured" to show a product on the home page.
    folder: src/products
    create: true
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{name}} · {{category}} · {{price}}"
    sortable_fields: [order, name, price, category]
    view_groups:
      - { label: Category, field: category }
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Price, name: price, widget: number, value_type: int, min: 0, hint: "Numbers only, e.g. 1200. The currency symbol is set in Site settings." }
      - label: Category
        name: category
        widget: select
        options: [Indoor, Outdoor, Planters, Care]
        hint: "To add a new category, add it to this list in src/admin/config.yml."
      - { label: Light, name: light, widget: select, options: [Low, Medium, Bright], required: false }
      - { label: Placement, name: placement, widget: select, options: [Indoor, Outdoor], required: false }
      - { label: Short note, name: note, widget: string, required: false, hint: "e.g. Medium light · Large" }
      - { label: Watering, name: watering, widget: string, required: false, hint: "e.g. When the top few centimetres of soil dry" }
      - { label: Photo, name: image, widget: image, choose_url: false }
      - { label: Featured on home page, name: featured, widget: boolean, default: false, required: false }
      - { label: Sort order, name: order, widget: number, value_type: int, required: false, hint: "Lower numbers appear first." }

  # ------------------------------------------------------------------
  # Page text and photos
  # ------------------------------------------------------------------
  - name: pages
    label: Pages
    files:
      - name: home
        label: Home
        file: src/_data/home.json
        fields:
          - { label: Browser tab title, name: title, widget: string }
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Layout, name: layout, widget: select, options: [Split, Full-bleed], default: Split }
              - { label: Headline, name: title, widget: string }
              - { label: Intro text, name: text, widget: text, hint: "Shown in the Split layout only." }
              - { label: Primary button, name: primary_button, widget: string }
              - { label: Secondary button, name: secondary_button, widget: string }
              - { label: Main photo, name: image, widget: image }
              - { label: Main photo description, name: image_alt, widget: string, required: false }
              - { label: Small photo, name: small_image, widget: image, hint: "Split layout only." }
              - { label: Small photo description, name: small_image_alt, widget: string, required: false }
              - { label: Badge title, name: badge_title, widget: string }
              - { label: Badge text, name: badge_text, widget: string }
          - label: What we do
            name: offerings
            widget: object
            fields:
              - { label: Heading, name: title, widget: string }
              - { label: Link text, name: link_label, widget: string }
              - label: Cards
                name: items
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: Small label, name: label, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
                  - { label: Photo, name: image, widget: image }
                  - { label: Photo description, name: image_alt, widget: string, required: false }
          - label: How we work (heading)
            name: process
            widget: object
            hint: "The steps themselves are edited under Pages → How we work steps."
            fields:
              - { label: Small label, name: eyebrow, widget: string }
              - { label: Heading, name: title, widget: string }
          - label: Selected projects
            name: projects
            widget: object
            fields:
              - { label: Heading, name: title, widget: string }
              - { label: Link text, name: link_label, widget: string }
              - { label: Link URL, name: link_url, widget: string, required: false, hint: "Leave empty to hide the link." }
              - label: Projects
                name: items
                widget: list
                summary: "{{fields.name}} ({{fields.type}})"
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Type, name: type, widget: string }
                  - { label: Photo, name: image, widget: image }
          - label: Shop preview
            name: shop
            widget: object
            hint: "Products shown here are the ones ticked as Featured in the Plant catalog."
            fields:
              - { label: Small label, name: eyebrow, widget: string }
              - { label: Heading, name: title, widget: string }
              - { label: Link text, name: link_label, widget: string }
          - label: Testimonial
            name: testimonial
            widget: object
            fields:
              - { label: Quote, name: quote, widget: text }
              - { label: Author, name: author, widget: string }

      - name: process
        label: How we work steps
        file: src/_data/process.json
        description: Shown on the Home and Services pages. Steps are numbered automatically.
        fields:
          - label: Steps
            name: steps
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text }

      - name: shop
        label: Products page
        file: src/_data/shop.json
        description: Text on the Products page. The products themselves are in the Plant catalog.
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Small label, name: eyebrow, widget: string }
          - { label: Intro, name: intro, widget: text }
          - { label: Category heading, name: category_heading, widget: string }
          - { label: '"All" filter label', name: all_label, widget: string }
          - { label: Light heading, name: light_heading, widget: string }
          - { label: Placement heading, name: placement_heading, widget: string }
          - { label: Product count label, name: count_label, widget: string, hint: 'Shown after the number, e.g. "9 products".' }
          - { label: Sort label, name: sort_label, widget: string }
          - { label: Sort option — featured, name: sort_featured, widget: string }
          - { label: Sort option — price low to high, name: sort_price_asc, widget: string }
          - { label: Sort option — price high to low, name: sort_price_desc, widget: string }
          - { label: Product button, name: button_label, widget: string }
          - { label: No results text, name: empty_text, widget: string }

      - name: services
        label: Services
        file: src/_data/services.json
        fields:
          - { label: Browser tab title, name: title, widget: string }
          - { label: Small label, name: eyebrow, widget: string }
          - { label: Heading, name: heading, widget: string }
          - { label: Intro, name: intro, widget: text }
          - { label: Button text, name: button_label, widget: string }
          - label: Services
            name: items
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Photo, name: image, widget: image }
              - { label: Photo description, name: image_alt, widget: string, required: false }
              - { label: Bullet points, name: points, widget: list, field: { label: Point, name: point, widget: string } }

      - name: about
        label: About us
        file: src/_data/about.json
        fields:
          - { label: Browser tab title, name: title, widget: string }
          - { label: Small label, name: eyebrow, widget: string }
          - { label: Heading, name: heading, widget: string }
          - { label: Our story, name: story, widget: markdown, buttons: [bold, italic, link, bulleted-list], editor_components: [] }
          - { label: Image, name: image, widget: image }
          - { label: Image description, name: image_alt, widget: string, required: false }
          - label: Values
            name: values
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text }
          - { label: Team heading, name: team_heading, widget: string }
          - label: Team
            name: team
            widget: list
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Role, name: role, widget: string }
              - { label: Photo, name: photo, widget: image }

      - name: contact
        label: Contact us
        file: src/_data/contact.json
        description: Email, phone, address and hours are edited in Site settings.
        fields:
          - { label: Browser tab title, name: title, widget: string }
          - { label: Small label, name: eyebrow, widget: string }
          - { label: Heading, name: heading, widget: string }
          - { label: Intro, name: intro, widget: text }
          - label: Contact form
            name: form
            widget: object
            collapsed: true
            fields:
              - { label: Enquiry type heading, name: enquiry_label, widget: string }
              - { label: '"Home" option', name: home_label, widget: string }
              - { label: '"Business" option', name: business_label, widget: string }
              - { label: Name label, name: name_label, widget: string }
              - { label: Phone label, name: phone_label, widget: string }
              - { label: Email label, name: email_label, widget: string }
              - { label: Address label, name: address_label, widget: string }
              - { label: Hours label, name: hours_label, widget: string }
              - { label: Location label (home), name: location_label_home, widget: string }
              - { label: Location label (business), name: location_label_business, widget: string }
              - { label: Message label, name: message_label, widget: string }
              - { label: Product enquiry prefix, name: product_prefill, widget: string, hint: "Pre-filled in the message when someone clicks Enquire on a product." }
              - { label: Submit button, name: submit_label, widget: string }
          - label: Booking (Calendly)
            name: booking
            widget: object
            fields:
              - { label: Small label, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Calendly link, name: calendly_url, widget: string, required: false, hint: "e.g. https://calendly.com/your-name/site-visit — leave empty to show a placeholder." }
          - label: Thank-you page
            name: thanks
            widget: object
            collapsed: true
            fields:
              - { label: Browser tab title, name: title, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Button, name: button, widget: string }

  # ------------------------------------------------------------------
  # Site-wide settings
  # ------------------------------------------------------------------
  - name: settings
    label: Site settings
    files:
      - name: site
        label: Site settings
        file: src/_data/site.json
        fields:
          - { label: Site name, name: name, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - { label: Description (for search engines), name: description, widget: text }
          - { label: Logo, name: logo, widget: image }
          - { label: "Logo (light, for the footer)", name: logo_light, widget: image }
          - { label: Currency symbol, name: currency, widget: string }
          - label: Menu labels
            name: nav
            widget: object
            fields:
              - { label: Home, name: home, widget: string }
              - { label: Products, name: products, widget: string }
              - { label: Services, name: services, widget: string }
              - { label: About us, name: about, widget: string }
              - { label: Contact us, name: contact, widget: string }
          - { label: Header button, name: header_button, widget: string }
          - label: Contact details
            name: contact
            widget: object
            fields:
              - { label: Email, name: email, widget: string, required: false }
              - { label: Phone, name: phone, widget: string, required: false }
              - { label: Address, name: address, widget: string, required: false }
              - { label: Opening hours, name: hours, widget: string, required: false }
          - label: Social links
            name: social
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Name, name: label, widget: string }
              - { label: URL, name: url, widget: string }
          - label: Bottom call-to-action
            name: cta
            widget: object
            fields:
              - { label: Heading, name: title, widget: string }
              - { label: Button, name: button, widget: string }
          - label: Footer
            name: footer
            widget: object
            fields:
              - { label: Pages heading, name: pages_heading, widget: string }
              - { label: Contact heading, name: contact_heading, widget: string }
              - { label: Follow heading, name: follow_heading, widget: string }
              - { label: Copyright name, name: copyright, widget: string }
